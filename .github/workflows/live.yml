# Prüfung der ausgelieferten Seite nach der Umstellung (Status, Kopfzeilen, Weiterleitungen, 404, Zertifikat).
# Auf Knopfdruck; läuft auf einem GitHub-Rechner, damit das Zertifikat ohne Zwischenstelle geprüft wird.
name: Live-Prüfung

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: ratsatlas.de prüfen
        run: |
          set -o pipefail
          scripts/live_pruefen.sh https://ratsatlas.de | tee live.tsv
          { echo '```'; cat live.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
