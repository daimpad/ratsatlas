# Pull Requests: Kacheln in site/index.html entsprechen staedte.json
name: Prüfen

on:
  pull_request:

permissions:
  contents: read

jobs:
  kacheln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Kacheln entsprechen staedte.json
        run: python3 scripts/kacheln.py --pruefen
