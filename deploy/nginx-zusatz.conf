# Vorschlag für Plesk → ratsatlas.de → Apache- & nginx-Einstellungen → „Zusätzliche nginx-Anweisungen“.
# Nur nötig, wenn nginx statische Dateien direkt ausliefert und dabei die Kopfzeilen aus .htaccess fehlen
# (Befund in Bonn, 28.10./01.11.2026: GET ohne Kopfzeilen, HEAD mit). Alternative: „Statische Dateien direkt
# durch nginx bereitstellen“ abschalten, dann gilt .htaccess. Nicht beides gleichzeitig, sonst doppelte Kopfzeilen.
# Nach dem Eintragen mit scripts/live_pruefen.sh (GET) prüfen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
error_page 404 /404.html;
location ~ /\.(git|htaccess) { return 404; }
